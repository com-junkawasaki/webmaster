<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 628" font-family="ui-sans-serif, -apple-system, 'Helvetica Neue', sans-serif">
  <defs>
    <marker id="loveArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <style>
      .heading { font-size: 22px; font-weight: 700; fill: #111827; }
      .deck { font-size: 13px; fill: #4b5563; }
      .panel { fill: #fafafa; stroke: #e5e7eb; stroke-width: 1; }
      .title { font-size: 18px; font-weight: 600; fill: #111827; }
      .subtitle { font-size: 12px; fill: #6b7280; }
      .kin { fill: #ffffff; stroke: #1f2937; stroke-width: 1.8; }
      .kin-faint { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
      .word { font-size: 12px; font-weight: 600; fill: #111827; }
      .word-faint { font-size: 11px; fill: #9ca3af; }
      .gloss { font-size: 11px; fill: #6b7280; }
      .marriage { stroke: #1f2937; stroke-width: 1.5; }
      .descent { stroke: #1f2937; stroke-width: 1.5; fill: none; }
      .descent-faint { stroke: #9ca3af; stroke-width: 1.3; fill: none; }
      .strained { stroke: #9ca3af; stroke-width: 1.5; stroke-dasharray: 4 3; fill: none; }
      .axis { stroke: #dc2626; stroke-width: 4; fill: none; }
      .axislabel { font-size: 11px; font-weight: 700; fill: #dc2626; }
      .box { fill: #ffffff; stroke: #e5e7eb; stroke-width: 1; }
      .boxtitle { font-size: 12px; font-weight: 700; fill: #111827; }
      .boxline { font-size: 11px; fill: #374151; }
      .legend { font-size: 11px; fill: #6b7280; }
    </style>
  </defs>

  <!-- Header -->
  <text x="490" y="36" text-anchor="middle" class="heading">The Structure of Love — Vertical or Horizontal</text>
  <text x="490" y="58" text-anchor="middle" class="deck">A kinship structure of love: the East turns on a vertical Mother–Son axis; the West on a horizontal Husband–Wife axis</text>

  <!-- =============== Panel 1: East / Vertical =============== -->
  <rect x="30" y="78" width="450" height="520" rx="10" class="panel"/>
  <text x="255" y="106" text-anchor="middle" class="title">Vertical · East</text>
  <text x="255" y="124" text-anchor="middle" class="subtitle">Mother–Son axis · the eldest son inherits the house</text>

  <!-- Gen 1 -->
  <rect x="158" y="153" width="34" height="34" rx="2" class="kin"/>
  <text x="175" y="147" text-anchor="middle" class="word">Father</text>
  <circle cx="262" cy="170" r="17" class="kin"/>
  <text x="262" y="147" text-anchor="middle" class="word">Mother</text>
  <line x1="192" y1="170" x2="245" y2="170" class="marriage"/>

  <!-- descent to the side children -->
  <path d="M218,170 L218,250" class="descent"/>
  <line x1="218" y1="250" x2="430" y2="250" class="descent"/>
  <path d="M370,250 L370,290" class="descent"/>
  <path d="M430,250 L430,287" class="descent"/>

  <!-- Gen 2 -->
  <rect x="245" y="293" width="34" height="34" rx="2" class="kin"/>
  <text x="262" y="345" text-anchor="middle" class="word">Eldest son</text>
  <rect x="353" y="293" width="34" height="34" rx="2" class="kin"/>
  <text x="370" y="345" text-anchor="middle" class="word">2nd son</text>
  <circle cx="430" cy="310" r="17" class="kin"/>
  <text x="430" y="345" text-anchor="middle" class="word">Daughter</text>

  <!-- son's wife, strained -->
  <circle cx="160" cy="310" r="17" class="kin"/>
  <text x="160" y="345" text-anchor="middle" class="word">Son's wife</text>
  <line x1="177" y1="310" x2="245" y2="310" class="strained"/>

  <!-- THE vertical axis: Mother -> Eldest son -->
  <path d="M262,187 L262,289" class="axis" marker-end="url(#loveArrow)"/>
  <text x="276" y="232" class="axislabel">love &amp;</text>
  <text x="276" y="246" class="axislabel">control</text>

  <!-- annotations -->
  <text x="160" y="362" text-anchor="middle" class="gloss">rival — “the other woman”</text>
  <text x="400" y="362" text-anchor="middle" class="gloss">free to marry for love</text>

  <!-- dynamics box -->
  <rect x="50" y="392" width="410" height="184" rx="6" class="box"/>
  <text x="65" y="414" class="boxtitle">What drives the vertical axis</text>
  <text x="65" y="436" class="boxline">• Confucian / Neo-Confucian primogeniture: the headship</text>
  <text x="65" y="452" class="boxline">  of the house passes to the eldest son.</text>
  <text x="65" y="474" class="boxline">• Authority and wealth concentrate in him.</text>
  <text x="65" y="496" class="boxline">• The mother enters as a low-status bride, so she binds</text>
  <text x="65" y="512" class="boxline">  the eldest son to hold real power in the house.</text>
  <text x="65" y="534" class="boxline">• → mother–son dependence; the son's wife becomes</text>
  <text x="65" y="550" class="boxline">  the rival, and is disliked.</text>
  <line x1="65" y1="560" x2="445" y2="560" stroke="#e5e7eb"/>
  <text x="65" y="571" class="legend">Sources: Zhu Xi, Family Rituals; the Confucian ie (house) system.</text>

  <!-- =============== Panel 2: West / Horizontal =============== -->
  <rect x="500" y="78" width="450" height="520" rx="10" class="panel"/>
  <text x="725" y="106" text-anchor="middle" class="title">Horizontal · West</text>
  <text x="725" y="124" text-anchor="middle" class="subtitle">Husband–Wife axis · “the two become one”</text>

  <!-- husband's parents (secondary, faint) -->
  <rect x="617" y="150" width="28" height="28" rx="2" class="kin-faint"/>
  <text x="631" y="144" text-anchor="middle" class="word-faint">Father</text>
  <circle cx="700" cy="158" r="14" class="kin-faint"/>
  <text x="700" y="144" text-anchor="middle" class="word-faint">Mother</text>
  <line x1="645" y1="164" x2="686" y2="164" stroke="#9ca3af" stroke-width="1.3"/>
  <path d="M665,172 L665,205 L662,205 L662,218" class="descent-faint"/>

  <!-- spouse axis (primary) -->
  <rect x="645" y="218" width="34" height="34" rx="2" class="kin"/>
  <text x="662" y="270" text-anchor="middle" class="word">Husband</text>
  <circle cx="790" cy="235" r="17" class="kin"/>
  <text x="790" y="270" text-anchor="middle" class="word">Wife</text>
  <!-- THE horizontal axis -->
  <path d="M679,235 L773,235" class="axis"/>
  <text x="726" y="214" text-anchor="middle" class="axislabel">the two become one</text>

  <!-- children -->
  <path d="M726,235 L726,295" class="descent"/>
  <line x1="690" y1="295" x2="762" y2="295" class="descent"/>
  <path d="M690,295 L690,320" class="descent"/>
  <path d="M762,295 L762,317" class="descent"/>
  <rect x="673" y="322" width="30" height="30" rx="2" class="kin"/>
  <text x="688" y="368" text-anchor="middle" class="word">Child</text>
  <circle cx="762" cy="337" r="15" class="kin"/>
  <text x="762" y="368" text-anchor="middle" class="word">Child</text>

  <!-- annotation -->
  <text x="852" y="231" text-anchor="middle" class="gloss">parents stay</text>
  <text x="852" y="245" text-anchor="middle" class="gloss">secondary</text>

  <!-- dynamics box -->
  <rect x="520" y="392" width="410" height="184" rx="6" class="box"/>
  <text x="535" y="414" class="boxtitle">What drives the horizontal axis</text>
  <text x="535" y="436" class="boxline">• Christian doctrine: a man and woman “become one</text>
  <text x="535" y="452" class="boxline">  flesh” (Genesis 2:24), ordained by God and Christ.</text>
  <text x="535" y="474" class="boxline">• Marriage is the primary bond.</text>
  <text x="535" y="496" class="boxline">• The spouse takes priority over parents and children.</text>
  <text x="535" y="518" class="boxline">• → spouse-centered; one who loves a parent or son</text>
  <text x="535" y="534" class="boxline">  more than the spouse is disliked.</text>
  <line x1="535" y1="560" x2="915" y2="560" stroke="#e5e7eb"/>
  <text x="535" y="571" class="legend">Source: Genesis 2:24; the Christian conjugal pair.</text>

  <!-- legend -->
  <text x="490" y="610" text-anchor="middle" class="legend">□ male  ·  ○ female  ·  — marriage  ·  │ descent  ·  ┄ strained tie  ·  <tspan fill="#dc2626" font-weight="700">red = primary axis of love (affection &amp; power)</tspan>  —  after Kawasaki, “Love as Self-Expansion”</text>
</svg>
