<script>
(async()=>{

function field(o,raw){const b=raw.slice(o.offset,o.offset+o.bytes);let values;if(o.dtype==='bf16'){const u=new Uint16Array(b.buffer,b.byteOffset,b.byteLength/2),bits=new Uint32Array(u.length);for(let i=0;i<u.length;i++)bits[i]=u[i]<<16;values=new Float32Array(bits.buffer)}else values=new Float32Array(b.buffer,b.byteOffset,b.byteLength/4);return {shape:o.shape,values}}

function rgbaVar(name){const p=document.createElement('span');root.appendChild(p);p.style.color='var(--background)';const bg=getComputedStyle(p).color;p.style.color='var('+name+')';const fg=getComputedStyle(p).color;p.remove();const c=document.createElement('canvas');c.width=c.height=1;const x=c.getContext('2d');x.fillStyle='Canvas';x.fillRect(0,0,1,1);x.fillStyle=bg;x.fillRect(0,0,1,1);x.fillStyle=fg;x.fillRect(0,0,1,1);const v=x.getImageData(0,0,1,1).data;return `rgb(${v[0]},${v[1]},${v[2]})`}
function theme(){colors={q:rgbaVar('--viz-series-1'),k:rgbaVar('--viz-series-2'),v:rgbaVar('--viz-series-3'),bg:rgbaVar('--background'),fg:rgbaVar('--foreground')};if(m)redraw()}
function vector(name,h,t){const o=m.arrays[name],start=o.shape.length===2?t*o.shape[1]:(h*o.shape[1]+t)*o.shape[2],n=o.shape.at(-1);return o.values.subarray(start,start+n)}
function kvHead(){return Math.floor(head/(m.heads/m.kv_heads))}
function vectors(){return {q:vector(mode==='raw'?'q_raw':'q_attn',head,qi),k:vector(mode==='raw'?'k_raw':'k_attn',kvHead(),kj),v:vector('v',kvHead(),kj)}}
const fmt=v=>Math.abs(v)>0&&Math.abs(v)<.0001?v.toExponential(5):Number(v).toPrecision(6);
function weights(){return vector('attention',head,qi)}
function tooltip(e,content){const b=root.getBoundingClientRect(),tip=q('qkv-tooltip');tip.textContent=content;tip.hidden=false;tip.style.left=Math.max(0,Math.min(e.clientX-b.left+10,b.width-240))+'px';tip.style.top=(e.clientY-b.top+12)+'px'}
function hideTip(){q('qkv-tooltip').hidden=true}
function updateSelected(){q('qkv-dimension-label').textContent=component+' / '+(m.head_dim-1);q('qkv-dimension').value=component;const v=vectors();q('qkv-selected').textContent='Component '+component+'：Q = '+fmt(v.q[component])+'　K = '+fmt(v.k[component])+'　V = '+fmt(v.v[component]);for(const view of Object.values(views)){if(!view.x)continue;const x=view.x(component);view.svg.select('[data-chart-hover-guide]').attr('x1',x).attr('x2',x);view.svg.select('[data-chart-hover-marker]').attr('cx',x).attr('cy',view.y(view.values[component]))}
 const a=weights()[kj],s=vector('scores',head,qi)[kj],c=vector('context',head,qi),rms=Math.sqrt(c.reduce((sum,v)=>sum+v*v,0)/c.length),masked=m.causal&&kj>qi;q('qkv-score').textContent='Scaled QK score '+fmt(s)+'　／　Attention '+(a*100).toFixed(5)+'%'+(masked?' (future position masked)':'')+'　／　This V component contribution '+fmt(a*vector('v',kvHead(),kj)[component])+'　／　Combined head context RMS '+fmt(rms)}
function chart(id,values,role){const svg=d3.select(q(id)),W=q(id).getBoundingClientRect().width,H=142,pad={l:64,r:18,t:8,b:42};svg.selectAll('*').remove();svg.attr('viewBox',`0 0 ${W} ${H}`);const vals=Array.from(values,(y,x)=>({x,y})),ext=d3.extent(vals,d=>d.y),span=(ext[1]-ext[0])||1;const x=d3.scaleLinear().domain(d3.extent(vals,d=>d.x)).range([pad.l+2,W-pad.r-2]),y=d3.scaleLinear().domain([Math.min(0,ext[0])-span*.06,Math.max(0,ext[1])+span*.06]).nice(3).range([H-pad.b,pad.t]);

 svg.append('path').datum(vals).attr('d',d3.line().x(d=>x(d.x)).y(d=>y(d.y))).attr('stroke',colors[role]).attr('stroke-width',1.3).attr('fill','none');svg.append('g').attr('transform',`translate(0,${H-pad.b})`).call(d3.axisBottom(x).ticks(W<400?3:6).tickFormat(d3.format('d')));svg.append('g').attr('transform',`translate(${pad.l},0)`).call(d3.axisLeft(y).ticks(3).tickFormat(d3.format('~g')));

 svg.append('line').attr('data-chart-hover-guide','').attr('y1',pad.t).attr('y2',H-pad.b).attr('stroke','var(--muted-foreground)').attr('stroke-width',1);svg.append('circle').attr('data-chart-hover-marker','').attr('r',3).attr('fill',colors[role]);

function attention(){const svg=d3.select(q('qkv-attention-plot')),W=q('qkv-attention-plot').getBoundingClientRect().width,H=142,pad={l:64,r:18,t:8,b:42};svg.selectAll('*').remove();svg.attr('viewBox',`0 0 ${W} ${H}`);const vals=Array.from(weights(),(value,index)=>({index,value})),x=d3.scaleBand().domain(vals.map(d=>d.index)).range([pad.l,W-pad.r]).padding(.15),y=d3.scaleLinear().domain([0,d3.max(vals,d=>d.value)||1]).nice(3).range([H-pad.b,pad.t]);svg.append('rect').attr('data-chart-frame','').attr('x',pad.l).attr('y',pad.t).attr('width',W-pad.l-pad.r).attr('height',H-pad.t-pad.b).attr('fill','none').attr('stroke','var(--border)');svg.selectAll('rect.attn').data(vals).join('rect').attr('class','attn').attr('x',d=>x(d.index)).attr('y',d=>y(d.value)).attr('width',x.bandwidth()).attr('height',d=>H-pad.b-y(d.value)).attr('fill',d=>d.index===kj?colors.k:colors.q).attr('opacity',d=>d.index===kj?1:.6);
